apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bootstrap-production
nameSuffix: -production
resources:
  - ../base
patches:
  - target:
      kind: Terraform
    patch: |-
      - op: replace
        path: /spec/planOnly
        value: false
      - op: add
        path: /spec/backendConfigsFrom/-
        value:
          kind: ConfigMap
          name: assembly-production-backend
      - op: add
        path: /spec/dependsOn
        value:
          - name: assembly-production
  - target:
      kind: Terraform
      name: assembly-us-east1
    patch: |-
      - op: add
        path: /spec/workspace
        value: us-east1-assembly-production
  - target:
      kind: Terraform
      name: assembly-us-east4
    patch: |-
      - op: add
        path: /spec/workspace
        value: us-east4-assembly-production
