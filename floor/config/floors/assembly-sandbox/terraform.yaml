apiVersion: v1
kind: ConfigMap
metadata:
  name: assembly-sandbox-backend
  namespace: bootstrap-sandbox
data:
  prefix: assembly
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: assembly-sandbox
  namespace: bootstrap-sandbox
spec:
  backendConfig:
    customConfiguration: |
      backend "gcs" {}
  backendConfigsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
      keys:
        - bucket
    - kind: ConfigMap
      name: assembly-sandbox-backend
  dependsOn:
    - name: foundation-sandbox
  destroyResourcesOnDeletion: false
  disableDriftDetection: true
  interval: 10m
  path: ./assembly
  planOnly: true
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: floor-bootstrap-auth
        - secretRef:
            name: floor-foundation-state-env
  serviceAccountName: tf-bootstrap
  sourceRef:
    kind: GitRepository
    name: foundation-source
  storeReadablePlan: json
  tfVarsFiles:
    - foundation/teams/factory.tfvars
  varsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
  workspace: assembly-main-sandbox
