apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: assembly-us-east1-sandbox
  namespace: bootstrap-sandbox
spec:
  backendConfig:
    customConfiguration: |
      backend "gcs" {}
  backendConfigsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
      keys:
        - bucket
    - kind: ConfigMap
      name: assembly-sandbox-backend
  dependsOn:
    - name: assembly-sandbox
  destroyResourcesOnDeletion: false
  disableDriftDetection: true
  interval: 10m
  path: ./assembly/regional
  planOnly: true
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: floor-bootstrap-auth
        - secretRef:
            name: floor-foundation-state-env
  serviceAccountName: tf-bootstrap
  sourceRef:
    kind: GitRepository
    name: foundation-source
  storeReadablePlan: json
  varsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
      varsKeys:
        - bucket
  workspace: us-east1-assembly-sandbox
