apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

patches:
  - path: foundation-common.yaml
    target:
      group: infra.contrib.fluxcd.io
      kind: Terraform
      labelSelector: app.kubernetes.io/component=foundation

resources:
  - namespace.yaml
  - runner-rbac.yaml
  - gitrepository.yaml
  - terraform.yaml
  - foundation.yaml
