apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: assembly-non-production
  namespace: flux-system
spec:
  dependsOn:
    - name: bootstrap-non-production
  interval: 1m
  path: ./floor/config/floors/assembly-non-production
  prune: false
  sourceRef:
    kind: GitRepository
    name: bootstrap-floor-config
  wait: false
