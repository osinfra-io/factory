apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: runtime-trust-sandbox
  namespace: bootstrap-sandbox
spec:
  backendConfig:
    customConfiguration: |
      backend "gcs" {}
  backendConfigsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
      keys:
        - bucket
    - kind: ConfigMap
      name: runtime-sandbox-backend
  destroyResourcesOnDeletion: false
  disableDriftDetection: true
  interval: 10m
  path: ./tofu/runtime/trust
  planOnly: false
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: floor-bootstrap-auth
        - secretRef:
            name: floor-foundation-state-env
  serviceAccountName: tf-bootstrap
  sourceRef:
    kind: GitRepository
    name: foundation-source
  storeReadablePlan: json
  workspace: trust-sandbox
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: runtime-onboarding-us-east1-b-sandbox
