apiVersion: v1
kind: ConfigMap
metadata:
  name: runtime-sandbox-backend
  namespace: bootstrap-sandbox
data:
  prefix: runtime
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: runtime-us-east1-b-sandbox
  namespace: bootstrap-sandbox
spec:
  backendConfig:
    customConfiguration: |
      backend "gcs" {}
  backendConfigsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
      keys:
        - bucket
    - kind: ConfigMap
      name: runtime-sandbox-backend
  dependsOn:
    - name: assembly-us-east1-sandbox
    - name: assembly-us-east4-sandbox
    - name: runtime-us-east4-a-sandbox
  destroyResourcesOnDeletion: false
  disableDriftDetection: true
  interval: 10m
  path: ./tofu/runtime/cluster
  planOnly: false
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: floor-bootstrap-auth
        - secretRef:
            name: floor-foundation-state-env
  serviceAccountName: tf-bootstrap
  sourceRef:
    kind: GitRepository
    name: foundation-source
  storeReadablePlan: json
  varsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
      varsKeys:
        - bucket
    - kind: ConfigMap
      name: runtime-sandbox-switch
      optional: true
  workspace: us-east1-b-runtime-sandbox
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: runtime-us-east4-a-sandbox
  namespace: bootstrap-sandbox
spec:
  backendConfig:
    customConfiguration: |
      backend "gcs" {}
  backendConfigsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
      keys:
        - bucket
    - kind: ConfigMap
      name: runtime-sandbox-backend
  dependsOn:
    - name: assembly-us-east4-sandbox
  destroyResourcesOnDeletion: false
  disableDriftDetection: true
  interval: 10m
  path: ./tofu/runtime/cluster
  planOnly: false
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: floor-bootstrap-auth
        - secretRef:
            name: floor-foundation-state-env
  serviceAccountName: tf-bootstrap
  sourceRef:
    kind: GitRepository
    name: foundation-source
  storeReadablePlan: json
  varsFrom:
    - kind: ConfigMap
      name: foundation-bootstrap-backend
      varsKeys:
        - bucket
    - kind: ConfigMap
      name: runtime-sandbox-switch
      optional: true
  workspace: us-east4-a-runtime-sandbox
