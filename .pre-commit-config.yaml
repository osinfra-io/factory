# Pre-commit
# https://github.com/pre-commit/pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-symlinks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ["-x"]

  - repo: https://github.com/osinfra-io/tofu-pre-commit-hooks
    rev:  a415d17a2efd722387cb0ade3b48b315d42d879f  # frozen: v0.3.2
    hooks:
      - id: tofu-fmt
        verbose: true

      # To speed up local validation:
      # mkdir -p $HOME/.opentofu.d/plugin-cache
      # Add the following to your ~/.zshrc:
      # export TF_PLUGIN_CACHE_DIR=$HOME/.opentofu.d/plugin-cache

      - id: tofu-validate
        verbose: true

      - id: tofu-lint
        verbose: true

      - id: tofu-scan
        verbose: true

      - id: tofu-test
        verbose: true

  - repo: local
    hooks:
      - id: shared-files
        name: check Floor shared files
        entry: python tests/check_shared_files.py
        language: python
        always_run: true
        pass_filenames: false

      - id: regal-lint
        name: regal lint
        entry: regal lint tofu/modules/kubernetes/opa-gatekeeper/regional/templates
        language: system  # requires regal to be installed locally (see StyraInc/setup-regal in CI)
        files: ^tofu/modules/kubernetes/opa-gatekeeper/regional/templates/.*\.rego$
        pass_filenames: false
